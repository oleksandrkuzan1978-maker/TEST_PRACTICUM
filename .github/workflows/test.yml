name: Python Tests

on:
  push:
    branches:
      - main

jobs:
  test: #Наименование задачи
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository #Названиие шага выполнения задачи (проверка репозитория)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run:
          pip install -r requirements.txt

      - name: Run tests
        run: pytest test/test_Lesson_7_Bocker
